name: E2E (Selenium Java)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pritani
          POSTGRES_PASSWORD: pritani
          POSTGRES_DB: db_pritani_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pritani"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          coverage: none

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Run Selenium suite
        run: ./e2e-java/run-e2e.sh
        env:
          E2E_DB_MODE: external
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: '5432'
          E2E_DB_NAME: db_pritani_e2e
          E2E_DB_USER: pritani
          E2E_DB_PASSWORD: pritani

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-reports
          path: |
            e2e-java/target/surefire-reports/
            e2e-java/target/screenshots/
          if-no-files-found: ignore
